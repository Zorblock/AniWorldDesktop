<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updating AniWorld Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #111318;
        color: #f7f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 0%, rgba(229, 67, 84, 0.2), transparent 42%),
          #111318;
      }

      main {
        width: 100%;
        padding: 28px 32px 30px;
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }

      .mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: none;
        border-radius: 13px;
        background: linear-gradient(145deg, #f05b68, #c92f47);
        box-shadow: 0 10px 28px rgba(201, 47, 71, 0.28);
        font-size: 20px;
        font-weight: 750;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .version {
        margin: 0;
        color: #989ca6;
        font-size: 13px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .status {
        font-weight: 600;
      }

      .percentage {
        color: #b9bcc4;
        font-variant-numeric: tabular-nums;
      }

      .track {
        position: relative;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #292c33;
      }

      .bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e54354, #ff7a77);
        box-shadow: 0 0 18px rgba(229, 67, 84, 0.45);
        transition: width 180ms ease-out;
      }

      .track.indeterminate .bar {
        width: 38%;
        animation: loading 1.2s ease-in-out infinite;
      }

      .detail {
        min-height: 18px;
        margin: 11px 0 0;
        color: #989ca6;
        font-size: 12px;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(270%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          transition: none;
        }

        .track.indeterminate .bar {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heading">
        <div class="mark" aria-hidden="true">A</div>
        <div>
          <h1>Updating AniWorld Desktop</h1>
          <p class="version" id="version">New version</p>
        </div>
      </div>

      <div class="status-row">
        <span class="status" id="status">Preparing update…</span>
        <span class="percentage" id="percentage"></span>
      </div>
      <div
        class="track indeterminate"
        id="track"
        role="progressbar"
        aria-label="Update progress"
      >
        <div class="bar" id="bar"></div>
      </div>
      <p class="detail" id="detail">The app will restart automatically</p>
    </main>

    <script>
      const version = window.__ANIWORLD_UPDATE_VERSION__;
      if (version) {
        document.querySelector("#version").textContent = `Version ${version}`;
      }

      const renderUpdaterState = ({ status, detail, percentage }) => {
        const track = document.querySelector("#track");
        const bar = document.querySelector("#bar");
        const percentageLabel = document.querySelector("#percentage");

        document.querySelector("#status").textContent = status;
        document.querySelector("#detail").textContent = detail;

        if (Number.isFinite(percentage)) {
          const normalized = Math.max(0, Math.min(100, percentage));
          track.classList.remove("indeterminate");
          track.setAttribute("aria-valuemin", "0");
          track.setAttribute("aria-valuemax", "100");
          track.setAttribute("aria-valuenow", String(normalized));
          bar.style.width = `${normalized}%`;
          percentageLabel.textContent = `${normalized}%`;
        } else {
          track.classList.add("indeterminate");
          track.removeAttribute("aria-valuemin");
          track.removeAttribute("aria-valuemax");
          track.removeAttribute("aria-valuenow");
          bar.style.width = "";
          percentageLabel.textContent = "";
        }
      };

      window.addEventListener("aniworld-updater-state", (event) => {
        renderUpdaterState(event.detail);
      });
      window.setUpdaterState = (state) => {
        window.__ANIWORLD_UPDATER_STATE__ = state;
        renderUpdaterState(state);
      };
      window.setUpdaterState(
        window.__ANIWORLD_UPDATER_STATE__ ?? {
          status: "Preparing update…",
          detail: "The app will restart automatically",
          percentage: null,
        },
      );
    </script>
  </body>
</html>
