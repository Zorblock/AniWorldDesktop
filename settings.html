<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/settings.css" />
    <title>Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <header class="app-titlebar" data-settings-titlebar>
      <div class="app-titlebar__drag" data-settings-drag-region>
        <span class="native-icon app-titlebar__icon" aria-hidden="true">&#xE713;</span>
        <span class="app-titlebar__title">AniWorld Desktop — Settings</span>
      </div>
      <div class="app-titlebar__controls" aria-label="Window controls">
        <button type="button" class="app-titlebar__button" data-window-action="minimize" title="Minimize" aria-label="Minimize">
          <span class="native-icon" aria-hidden="true">&#xE921;</span>
        </button>
        <button type="button" class="app-titlebar__button app-titlebar__button--close" data-window-action="close" title="Close" aria-label="Close">
          <span class="native-icon" aria-hidden="true">&#xE8BB;</span>
        </button>
      </div>
    </header>

    <main class="settings-shell">
      <header class="settings-header">
        <span class="settings-icon" aria-hidden="true">
          <span class="native-icon">&#xE713;</span>
        </span>
        <div>
          <h1>Settings</h1>
          <p>Customize AniWorld Desktop.</p>
        </div>
      </header>

      <section class="empty-state" aria-label="Settings placeholder">
        <div class="empty-state__line"></div>
        <p>Your settings will appear here.</p>
      </section>
    </main>
  </body>
</html>
